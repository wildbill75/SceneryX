
<!DOCTYPE html>
<html>
<head>
<script src='https://cdn.tailwindcss.com'></script>
</head>
<body class='bg-slate-950 p-8 flex flex-col gap-6 text-white'>

<!-- Option 1: Flag in place of the square ES, with rounded corners and gradient opacity -->
<div class='p-4 rounded-2xl bg-gradient-to-br from-indigo-950/90 via-slate-900 to-slate-950 border border-indigo-500/30 space-y-3 shadow-xl relative overflow-hidden w-[400px]'>
    <div class='flex items-center gap-3'>
        <div class='w-14 h-10 rounded-xl overflow-hidden border border-indigo-500/40 shadow-lg relative shrink-0'>
            <img src='https://flagcdn.com/w160/es.png' class='w-full h-full object-cover opacity-90' />
            <div class='absolute inset-0 bg-gradient-to-t from-slate-950/40 via-transparent to-transparent'></div>
        </div>
        <div class='min-w-0 flex-1'>
            <h3 class='text-2xl font-black text-white leading-snug'>Spain</h3>
            <p class='text-xs font-semibold text-indigo-300/80'>Country Scenery & Airport Network</p>
        </div>
    </div>
</div>

<!-- Option 2: The square ES is replaced by a large background flag in opacity gradient -->
<div class='p-4 rounded-2xl bg-gradient-to-br from-indigo-950/90 via-slate-900 to-slate-950 border border-indigo-500/30 space-y-3 shadow-xl relative overflow-hidden w-[400px]'>
    <div class='absolute right-0 top-0 bottom-0 w-3/5 pointer-events-none overflow-hidden'>
        <img src='https://flagcdn.com/w320/es.png' class='w-full h-full object-cover object-right opacity-25' style='mask-image: linear-gradient(to left, rgba(0,0,0,1) 0%, transparent 100%); -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 0%, transparent 100%);' />
    </div>
    <div class='relative z-10'>
        <h3 class='text-2xl font-black text-white leading-snug'>Spain</h3>
        <p class='text-xs font-semibold text-indigo-300/80'>Country Scenery & Airport Network</p>
    </div>
</div>

<!-- Option 3: Combined - Flag badge with gradient border + background flag in opacity gradient -->
<div class='p-4 rounded-2xl bg-gradient-to-br from-indigo-950/90 via-slate-900 to-slate-950 border border-indigo-500/30 space-y-3 shadow-xl relative overflow-hidden w-[400px]'>
    <div class='absolute right-0 top-0 bottom-0 w-3/5 pointer-events-none overflow-hidden'>
        <img src='https://flagcdn.com/w320/es.png' class='w-full h-full object-cover object-right opacity-20' style='mask-image: linear-gradient(to left, rgba(0,0,0,1) 0%, transparent 100%); -webkit-mask-image: linear-gradient(to left, rgba(0,0,0,1) 0%, transparent 100%);' />
    </div>
    <div class='flex items-center gap-3 relative z-10'>
        <div class='w-14 h-10 rounded-xl overflow-hidden border border-indigo-500/40 shadow-lg relative shrink-0'>
            <img src='https://flagcdn.com/w160/es.png' class='w-full h-full object-cover' />
        </div>
        <div class='min-w-0 flex-1'>
            <h3 class='text-2xl font-black text-white leading-snug'>Spain</h3>
            <p class='text-xs font-semibold text-indigo-300/80'>Country Scenery & Airport Network</p>
        </div>
    </div>
</div>

</body>
</html>
