<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260">
  <defs>
    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="sx-grad-h1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Neon Purple to Cyan Gradient -->
    <linearGradient id="sx-grad-h2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- X Letter Cyan Accent Gradient -->
    <linearGradient id="sx-grad-x" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Layer: Background -->
  <g id="Layer_Background">
    <rect width="1000" height="260" rx="28" fill="#0b111e" />
    <rect x="2" y="2" width="996" height="256" rx="26" fill="none" stroke="#1e293b" stroke-width="2" />
  </g>

  <!-- Layer: Icon Emblem -->
  <g id="Layer_Emblem" transform="translate(40, 30)">
    <!-- Icon Container Box -->
    <rect width="200" height="200" rx="44" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <!-- Radar Rings -->
    <circle cx="100" cy="100" r="80" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="100" cy="100" r="52" fill="none" stroke="#334155" stroke-width="1.5" />
    
    <!-- Runway 1 -->
    <line x1="40" y1="40" x2="160" y2="160" stroke="url(#sx-grad-h1)" stroke-width="24" stroke-linecap="round" />
    <line x1="40" y1="40" x2="160" y2="160" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 8" opacity="0.85" />
    
    <!-- Runway 2 -->
    <line x1="160" y1="40" x2="40" y2="160" stroke="url(#sx-grad-h2)" stroke-width="24" stroke-linecap="round" />
    <line x1="160" y1="40" x2="40" y2="160" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 8" opacity="0.85" />
    
    <!-- Beacon Dot -->
    <circle cx="100" cy="100" r="16" fill="#06b6d4" fill-opacity="0.4" />
    <circle cx="100" cy="100" r="9" fill="#ffffff" />
  </g>

  <!-- Layer: Typography (Editable & Illustrator Compatible) -->
  <g id="Layer_Typography" transform="translate(280, 0)">
    <!-- Brand Name: SCENERYX -->
    <text x="0" y="146" 
          font-family="'JetBrains Mono', 'Outfit', 'Segoe UI', 'Montserrat', Arial, sans-serif" 
          font-size="82" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#f8fafc">SCENERY<tspan fill="url(#sx-grad-x)" font-weight="900">X</tspan></text>

    <!-- Version Badge -->
    <g transform="translate(560, 84)">
      <rect width="112" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="56" y="19" 
            font-family="'JetBrains Mono', monospace, Arial" 
            font-size="13" 
            font-weight="700" 
            fill="#94a3b8" 
            text-anchor="middle" 
            letter-spacing="1">v1.0.1-BETA</text>
    </g>

    <!-- Subtitle / Tagline -->
    <text x="4" y="188" 
          font-family="'Outfit', 'Segoe UI', Arial, sans-serif" 
          font-size="18" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#64748b" 
          text-transform="uppercase">FLIGHT SIMULATOR SCENERY SUITE</text>
  </g>
</svg>
