<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cyan to Royal Blue Gradient -->
    <linearGradient id="sx-grad-runway1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Neon Purple to Cyan Gradient -->
    <linearGradient id="sx-grad-runway2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glass Glow Gradient -->
    <radialGradient id="sx-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Layer: Background Plate -->
  <g id="Layer_Background">
    <rect width="512" height="512" rx="112" fill="#090d16" />
    <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#1e293b" stroke-width="4" stroke-opacity="0.8" />
  </g>

  <!-- Layer: Radar Elements -->
  <g id="Layer_Radar">
    <!-- Ambient Glow -->
    <circle cx="256" cy="256" r="220" fill="url(#sx-glow)" />

    <!-- Crosshair Grid -->
    <line x1="256" y1="40" x2="256" y2="472" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />
    <line x1="40" y1="256" x2="472" y2="256" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8" opacity="0.6" />

    <!-- Radar Range Rings -->
    <circle cx="256" cy="256" r="204" fill="none" stroke="#1e293b" stroke-width="4" stroke-dasharray="10 8" />
    <circle cx="256" cy="256" r="132" fill="none" stroke="#334155" stroke-width="3" />
    <circle cx="256" cy="256" r="64" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.7" />
  </g>

  <!-- Layer: Runway Beams (The "X") -->
  <g id="Layer_Runways">
    <!-- Runway 1: Top-Left to Bottom-Right -->
    <line x1="102" y1="102" x2="410" y2="410" stroke="url(#sx-grad-runway1)" stroke-width="62" stroke-linecap="round" />
    <!-- Runway 1 Centerline -->
    <line x1="102" y1="102" x2="410" y2="410" stroke="#ffffff" stroke-width="10" stroke-dasharray="24 18" stroke-linecap="butt" opacity="0.9" />

    <!-- Runway 2: Top-Right to Bottom-Left -->
    <line x1="410" y1="102" x2="102" y2="410" stroke="url(#sx-grad-runway2)" stroke-width="62" stroke-linecap="round" />
    <!-- Runway 2 Centerline -->
    <line x1="410" y1="102" x2="102" y2="410" stroke="#ffffff" stroke-width="10" stroke-dasharray="24 18" stroke-linecap="butt" opacity="0.9" />
  </g>

  <!-- Layer: Beacon Center -->
  <g id="Layer_Beacon">
    <circle cx="256" cy="256" r="42" fill="#06b6d4" fill-opacity="0.35" />
    <circle cx="256" cy="256" r="24" fill="#ffffff" />
    <circle cx="256" cy="256" r="10" fill="#06b6d4" />
  </g>
</svg>
