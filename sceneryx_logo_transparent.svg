<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220">
  <defs>
    <linearGradient id="sx-trans-grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="sx-trans-grad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="sx-trans-x" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Layer: Icon Emblem -->
  <g id="Layer_Emblem" transform="translate(10, 10)">
    <rect width="200" height="200" rx="44" fill="#0f172a" stroke="#334155" stroke-width="2" />
    
    <circle cx="100" cy="100" r="80" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />
    <circle cx="100" cy="100" r="52" fill="none" stroke="#334155" stroke-width="1.5" />
    
    <line x1="40" y1="40" x2="160" y2="160" stroke="url(#sx-trans-grad1)" stroke-width="24" stroke-linecap="round" />
    <line x1="40" y1="40" x2="160" y2="160" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 8" opacity="0.85" />
    
    <line x1="160" y1="40" x2="40" y2="160" stroke="url(#sx-trans-grad2)" stroke-width="24" stroke-linecap="round" />
    <line x1="160" y1="40" x2="40" y2="160" stroke="#ffffff" stroke-width="4" stroke-dasharray="10 8" opacity="0.85" />
    
    <circle cx="100" cy="100" r="16" fill="#06b6d4" fill-opacity="0.4" />
    <circle cx="100" cy="100" r="9" fill="#ffffff" />
  </g>

  <!-- Layer: Typography -->
  <g id="Layer_Typography" transform="translate(250, 0)">
    <text x="0" y="132" 
          font-family="'JetBrains Mono', 'Outfit', 'Segoe UI', 'Montserrat', Arial, sans-serif" 
          font-size="86" 
          font-weight="800" 
          letter-spacing="4" 
          fill="#f8fafc">SCENERY<tspan fill="url(#sx-trans-x)" font-weight="900">X</tspan></text>

    <!-- Tagline -->
    <text x="4" y="174" 
          font-family="'Outfit', 'Segoe UI', Arial, sans-serif" 
          font-size="17" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#94a3b8" 
          text-transform="uppercase">FLIGHT SIMULATOR SCENERY SUITE</text>
  </g>
</svg>
